{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "metis.serviceAccountName" . }}
  labels:
    {{- include "metis.labels" (dict "root" . "component" "rbac") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- /*
#1375 — the ServiceAccount of the UI and both sidecars. It carries no
annotations (no IRSA role) and is bound to no Role, and its token is not
mounted: those pods never call the Kubernetes or AWS APIs.
*/ -}}
{{- if .Values.serviceAccount.workload.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "metis.workloadServiceAccountName" . }}
  labels:
    {{- include "metis.labels" (dict "root" . "component" "workload") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
