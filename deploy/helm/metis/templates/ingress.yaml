{{- /*
Ingress — sub-issue #369.
Switches between alb | nginx | traefik via .Values.ingress.className.
Routes:
  /api/auth/oidc, /api/auth/saml → server (4000)  (SSO; the UI has no route)
  /socket.io/* → server (4000)  (websocket upgrade)
  /             → ui (3000)     (includes /api: the UI proxies it to the server)
*/ -}}
{{- if .Values.ingress.enabled -}}
{{- $fullname := include "metis.fullname" . -}}
{{- $serverSvc := printf "%s-server" $fullname -}}
{{- $uiSvc := printf "%s-ui" $fullname -}}
{{- $cn := .Values.ingress.className -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "metis.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  annotations:
  {{- if eq $cn "alb" }}
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.alb.scheme | quote }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: {{ .Values.ingress.alb.listenPorts | quote }}
    {{- if .Values.ingress.alb.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.alb.certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-redirect: {{ .Values.ingress.alb.sslRedirect | quote }}
    {{- end }}
    {{- if .Values.ingress.websocket.enabled }}
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds={{ .Values.ingress.alb.stickinessSeconds }}
    {{- end }}
    {{- with .Values.ingress.alb.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else if eq $cn "nginx" }}
    {{- if .Values.ingress.tls.certManager.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.certManager.clusterIssuer | quote }}
    {{- end }}
    {{- if .Values.ingress.websocket.enabled }}
    {{- /*
      #1312 — ingress-nginx forwards the WebSocket Upgrade/Connection headers on
      every location by itself; it only needs the long read/send timeouts so an
      idle /socket.io connection is not cut at the 60 s default. The chart used to
      add a `configuration-snippet` setting those headers, and ingress-nginx
      v1.9+ rejects every snippet annotation by default
      (allow-snippet-annotations=false): the admission webhook refused the whole
      Ingress, so `helm install` failed on a stock controller.
    */}}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    {{- end }}
    {{- /*
      #1312 — ingress-nginx caps request bodies at 1m by default, so a document
      upload (10 MB cap) or a repository archive (MAX_UPLOAD_ARCHIVE_BYTES, 50 MB)
      was refused with 413 before it reached METIS. Match the server's largest cap.
    */}}
    {{- with .Values.ingress.nginx.proxyBodySize }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.nginx.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else if eq $cn "traefik" }}
    {{- if .Values.ingress.tls.certManager.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.certManager.clusterIssuer | quote }}
    {{- end }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- with .Values.ingress.traefik.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ $cn }}
  {{- if or .Values.ingress.tls.certManager.enabled .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- if .Values.ingress.tls.secretName }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
      {{- else if .Values.ingress.tls.certManager.enabled }}
      secretName: {{ printf "%s-tls" $fullname | quote }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- /*
            #1312 — `/api` goes to the UI, not the server. The UI's Next.js route
            handlers (ui/src/app/api) are the browser's API: they mint the
            HttpOnly session cookies at login and forward every other call to
            METIS_API_URL with the token attached. Routing `/api` straight to the
            server answered login with 200 and the tokens in the JSON body, set no
            cookie, and the UI sent the user back to /login. docker-compose.prod
            works the same way: the browser reaches the server only through :3000.

            The SSO endpoints are the exception. The server serves them
            (server/src/routes/sso.ts), and the UI has no route for them: its
            /api catch-all answers /api/auth/* with 404. So the OIDC and SAML
            login redirects, the OIDC callback, and the SAML ACS and metadata go
            to the server. They are listed first, because ALB evaluates rules in
            order; nginx and traefik pick the longest prefix either way.
          */}}
          {{- range $ssoPath := list "/api/auth/oidc" "/api/auth/saml" }}
          - path: {{ $ssoPath }}
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ $serverSvc }}
                port:
                  number: {{ $.Values.server.service.port }}
          {{- end }}
          - path: /socket.io
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ $serverSvc }}
                port:
                  number: {{ .Values.server.service.port }}
          - path: /
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ $uiSvc }}
                port:
                  number: {{ .Values.ui.service.port }}
{{- end }}
