{{- /*
Ingress — sub-issue #369.
Switches between alb | nginx | traefik via .Values.ingress.className.
Routes:
  /api/*       → server (4000)
  /socket.io/* → server (4000)  (websocket upgrade)
  /             → ui (3000)
*/ -}}
{{- if .Values.ingress.enabled -}}
{{- $fullname := include "metis.fullname" . -}}
{{- $serverSvc := printf "%s-server" $fullname -}}
{{- $uiSvc := printf "%s-ui" $fullname -}}
{{- $cn := .Values.ingress.className -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "metis.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  annotations:
  {{- if eq $cn "alb" }}
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.alb.scheme | quote }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: {{ .Values.ingress.alb.listenPorts | quote }}
    {{- if .Values.ingress.alb.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.alb.certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-redirect: {{ .Values.ingress.alb.sslRedirect | quote }}
    {{- end }}
    {{- if .Values.ingress.websocket.enabled }}
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds={{ .Values.ingress.alb.stickinessSeconds }}
    {{- end }}
    {{- with .Values.ingress.alb.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else if eq $cn "nginx" }}
    {{- if .Values.ingress.tls.certManager.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.certManager.clusterIssuer | quote }}
    {{- end }}
    {{- if .Values.ingress.websocket.enabled }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    {{- end }}
    {{- with .Values.ingress.nginx.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else if eq $cn "traefik" }}
    {{- if .Values.ingress.tls.certManager.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.certManager.clusterIssuer | quote }}
    {{- end }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- with .Values.ingress.traefik.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ $cn }}
  {{- if or .Values.ingress.tls.certManager.enabled .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- if .Values.ingress.tls.secretName }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
      {{- else if .Values.ingress.tls.certManager.enabled }}
      secretName: {{ printf "%s-tls" $fullname | quote }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ $serverSvc }}
                port:
                  number: {{ .Values.server.service.port }}
          - path: /socket.io
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ $serverSvc }}
                port:
                  number: {{ .Values.server.service.port }}
          - path: /
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ $uiSvc }}
                port:
                  number: {{ .Values.ui.service.port }}
{{- end }}
