{{- /*
External Secrets Operator integration — sub-issue #368.
Projects AWS Secrets Manager values into a Secret named `metis.secretName`.
Requires External Secrets Operator + a SecretStore/ClusterSecretStore named
.Values.externalSecrets.secretStoreName already installed in the cluster.
*/ -}}
{{- if .Values.externalSecrets.enabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "metis.secretName" . }}
  labels:
    {{- include "metis.labels" (dict "root" . "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "metis.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $envName, $secretKey := .Values.secrets.keyMap }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ printf "%s%s" $.Values.externalSecrets.remoteRefPrefix $secretKey }}
    {{- end }}
{{- end }}
