{{- /* HPA templates — sub-issue #371. */ -}}
{{- $fullname := include "metis.fullname" . -}}
{{- range $component := tuple "ui" "server" "embeddings" }}
{{- $cfg := index $.Values.autoscaling $component }}
{{- if $cfg.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ printf "%s-%s" $fullname $component }}
  labels:
    {{- include "metis.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ printf "%s-%s" $fullname $component }}
  minReplicas: {{ $cfg.minReplicas }}
  maxReplicas: {{ $cfg.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
