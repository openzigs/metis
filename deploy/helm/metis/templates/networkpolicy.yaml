{{- /*
NetworkPolicy — sub-issue #371, reworked in #1374.

Four policies. NetworkPolicies are additive (a pod may do whatever ANY policy
selecting it allows), so each one below only ever GRANTS:

  <fullname>-default-deny  every pod of the release: deny all ingress + egress,
                           except DNS.
  <fullname>-ui            ingress controller -> ui; ui -> server.
  <fullname>-server        ingress controller, ui (its /api proxy) and, with a
                           ServiceMonitor, Prometheus -> server; server ->
                           sidecars, the MCP namespace, the Kubernetes API,
                           external HTTPS, the database and `egress.extra`.
  <fullname>-sidecars      server -> embeddings / sql-lineage. No egress beyond
                           DNS: both sidecars are air-gapped by default.

Pods are selected on `metis.releaseSelectorLabels` / `metis.selectorLabels`,
the labels the POD TEMPLATE carries (#1374: the policy used to select
`app.kubernetes.io/part-of`, which only the Deployment object has, so it
isolated nothing). `tests/render-tests.sh` asserts every rendered pod is
selected.

External HTTPS is an `ipBlock` (a `namespaceSelector` matches only pods in
the cluster, never an external address). With networkPolicy.cilium.enabled the
ipBlock rules for HTTPS and the Kubernetes API are left out and
cilium-networkpolicy.yaml scopes them by FQDN / entity instead; these four
policies still render and carry the default-deny and the in-cluster rules.
*/ -}}
{{- if .Values.networkPolicy.enabled -}}
{{- $fullname := include "metis.fullname" . -}}
{{- $np := .Values.networkPolicy -}}
{{- $cilium := $np.cilium.enabled -}}
{{- range $np.egress.extra }}
{{- range (.components | default list) }}
{{- if not (has . (list "server" "ui" "embeddings" "sql-lineage" "backup")) }}
{{- fail (printf "metis: networkPolicy.egress.extra[].components names %q; use server, ui, embeddings, sql-lineage or backup (#1374)" .) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-default-deny" $fullname }}
  labels:
    {{- include "metis.labels" (dict "root" . "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "metis.releaseSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    # DNS resolution — the only thing every pod may do.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- if .Values.ui.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-ui" $fullname }}
  labels:
    {{- include "metis.labels" (dict "root" . "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "metis.selectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.ingressNamespaceSelector | nindent 14 }}
      ports:
        - port: {{ .Values.ui.service.port }}
          protocol: TCP
  {{- if .Values.server.enabled }}
  egress:
    # The UI's /api route handlers proxy every browser call to the server.
    - to:
        - podSelector:
            matchLabels:
              {{- include "metis.selectorLabels" (dict "root" . "component" "server") | nindent 14 }}
      ports:
        - port: {{ .Values.server.service.port }}
          protocol: TCP
  {{- end }}
{{- end }}
{{- if .Values.server.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-server" $fullname }}
  labels:
    {{- include "metis.labels" (dict "root" . "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "metis.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # SSO callbacks and /socket.io route to the server directly (ingress.yaml).
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.ingressNamespaceSelector | nindent 14 }}
        {{- if .Values.ui.enabled }}
        - podSelector:
            matchLabels:
              {{- include "metis.selectorLabels" (dict "root" . "component" "ui") | nindent 14 }}
        {{- end }}
      ports:
        - port: {{ .Values.server.service.port }}
          protocol: TCP
    {{- if .Values.serviceMonitor.enabled }}
    # Prometheus scrapes /metrics (servicemonitor.yaml).
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.monitoringNamespaceSelector | nindent 14 }}
      ports:
        - port: {{ .Values.server.service.port }}
          protocol: TCP
    {{- end }}
  egress:
    {{- if .Values.embeddings.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "metis.selectorLabels" (dict "root" . "component" "embeddings") | nindent 14 }}
      ports:
        - port: {{ .Values.embeddings.service.port }}
          protocol: TCP
    {{- end }}
    {{- if .Values.sqlLineage.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "metis.selectorLabels" (dict "root" . "component" "sql-lineage") | nindent 14 }}
      ports:
        - port: {{ .Values.sqlLineage.service.port }}
          protocol: TCP
    {{- end }}
    {{- with .Values.rbac.mcpNamespace }}
    # k8s-sse MCP runtime: the server talks to the MCP pods it provisions here.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
    {{- end }}
    {{- if not $cilium }}
    {{- with $np.egress.kubeApiServer }}
    {{- if .cidrs }}
    # Kubernetes API (k8s-sse MCP runtime). Policy is evaluated after the
    # kubernetes Service is DNATed, so on kubeadm/kind the port is 6443.
    - to:
        {{- range .cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- include "metis.netpolPorts" .ports | trim | nindent 8 }}
    {{- end }}
    {{- end }}
    {{- with $np.egress.https }}
    {{- if .cidrs }}
    # Outbound HTTPS: AI provider gateways, GitHub, OIDC discovery. Narrow
    # `cidrs` to restrict it; an FQDN allow-list needs Cilium (see above).
    - to:
        {{- $except := .except }}
        {{- range .cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
            {{- with $except }}
            except:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
        {{- end }}
      ports:
        {{- include "metis.netpolPorts" .ports | trim | nindent 8 }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- include "metis.netpolComponentEgress" (dict "root" . "component" "server") | trim | nindent 4 }}
{{- end }}
{{- if and .Values.server.enabled (or .Values.embeddings.enabled .Values.sqlLineage.enabled) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-sidecars" $fullname }}
  labels:
    {{- include "metis.labels" (dict "root" . "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "metis.releaseSelectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [embeddings, sql-lineage]
  policyTypes: [Ingress]
  ingress:
    # Only the server calls the sidecars (each also checks its own token).
    - from:
        - podSelector:
            matchLabels:
              {{- include "metis.selectorLabels" (dict "root" . "component" "server") | nindent 14 }}
{{- end }}
{{- /*
Opt-in egress for the other pods: `egress.extra` entries naming them in
`components` (e.g. embeddings -> an HF_ENDPOINT mirror with HF_HUB_OFFLINE=0),
and databaseCidrs for the backup CronJob (a pg_dump override). Rendered only
when there is a rule to grant.
*/}}
{{- $enabled := dict "ui" .Values.ui.enabled "embeddings" .Values.embeddings.enabled "sql-lineage" .Values.sqlLineage.enabled "backup" .Values.backup.enabled }}
{{- range $component := list "ui" "embeddings" "sql-lineage" "backup" }}
{{- $rules := include "metis.netpolComponentEgress" (dict "root" $ "component" $component) | trim }}
{{- if and (index $enabled $component) $rules }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-egress-%s" $fullname $component }}
  labels:
    {{- include "metis.labels" (dict "root" $ "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "metis.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- $rules | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
