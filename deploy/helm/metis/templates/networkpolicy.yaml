{{- /*
NetworkPolicy — sub-issue #371.
Deny-default ingress + deny-default egress with explicit allow-list.
For FQDN-aware egress (api.openai.com etc.) use the Cilium variant by setting
networkPolicy.cilium.enabled=true (cilium-networkpolicy.yaml).
*/ -}}
{{- if and .Values.networkPolicy.enabled (not .Values.networkPolicy.cilium.enabled) -}}
{{- $fullname := include "metis.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-default-deny" $fullname }}
  labels:
    {{- include "metis.labels" (dict "root" . "component" "netpol") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: metis
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Allow from configured ingress controller namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
    # Allow intra-namespace traffic (server↔embeddings↔sql-lineage↔ui).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: metis
              app.kubernetes.io/instance: {{ .Release.Name }}
  egress:
    # DNS resolution.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Intra-namespace.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: metis
              app.kubernetes.io/instance: {{ .Release.Name }}
    # Outbound HTTPS (required for AI provider gateways + GitHub API).
    # Without an FQDN-aware CNI (Cilium), we collapse to a port-only rule and
    # document the gap in the chart README. See cilium-networkpolicy.yaml for
    # the FQDN-scoped variant.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
          protocol: TCP
    {{- with .Values.networkPolicy.egress.databaseCidrs }}
    # Managed-DB egress (e.g. RDS subnets).
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
{{- end }}
