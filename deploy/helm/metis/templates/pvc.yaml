{{- /*
PVC templates — sub-issue #367 (CRITICAL).
Default: EBS gp3 RWO. Toggle persistence.efs.enabled=true to switch to RWX.
Reclaim policy is set on the StorageClass — `helm.sh/resource-policy: keep`
ensures `helm uninstall` does not delete the PVC even if the SC reclaim is Delete.

Each claim has its own `enabled` toggle under `persistence.<volume>` (#60 for
`data`, #75 for `uploads` and `lancedb`); a disabled one is an emptyDir in the
server pod instead (templates/_components.tpl).
*/ -}}
{{- if .Values.persistence.enabled -}}
{{- $efs := .Values.persistence.efs.enabled -}}
{{- $accessModes := list "ReadWriteOnce" -}}
{{- if $efs }}{{ $accessModes = list "ReadWriteMany" }}{{ end -}}
{{- $keep := eq .Values.persistence.reclaimPolicy "Retain" | ternary "keep" "" -}}
{{- $root := . -}}
{{- $first := true -}}
{{- range $volume := list "uploads" "lancedb" "data" }}
{{- $cfg := index $root.Values.persistence $volume }}
{{- if $cfg.enabled }}
{{- if not $first }}
---
{{- end }}
{{- $first = false }}
{{- if eq $volume "data" }}
# #60 — the server's data directory: the SQLite default (/app/server/data/metis.db)
# when DATABASE_URL is unset, and repo archive extracts.
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-server-%s" (include "metis.fullname" $root) $volume }}
  labels:
    {{- include "metis.labels" (dict "root" $root "component" "server") | nindent 4 }}
  annotations:
    # Retain the PVC even if `helm uninstall` is run by an over-eager operator.
    "helm.sh/resource-policy": {{ $keep | quote }}
spec:
  accessModes:
    {{- toYaml $accessModes | nindent 4 }}
  storageClassName: {{ ternary $root.Values.persistence.efs.storageClassName $cfg.storageClassName $efs | quote }}
  resources:
    requests:
      storage: {{ $cfg.size | quote }}
{{- end }}
{{- end }}
{{- end }}
