{{- /*
Plain Secret fallback — sub-issue #368.
Renders ONLY when externalSecrets.enabled=false AND secrets.create=true.
For BYO Secret (`secrets.create=false`, `secrets.existingSecret=...`) the
deployments still reference `metis.secretName` but no Secret is rendered here.
*/ -}}
{{- if and .Values.secrets.create (not .Values.externalSecrets.enabled) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metis.secretName" . }}
  labels:
    {{- include "metis.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    {{- if not .Values.secrets.values }}
    metis.io/empty-placeholder: "true"
    metis.io/note: "kubectl edit secret to fill values, or set secrets.values for dev only"
    {{- end }}
type: Opaque
{{- if .Values.secrets.values }}
stringData:
  {{- range $envName, $secretKey := .Values.secrets.keyMap }}
  {{- if hasKey $.Values.secrets.values $secretKey }}
  {{ $secretKey }}: {{ index $.Values.secrets.values $secretKey | quote }}
  {{- end }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
{{- end }}
