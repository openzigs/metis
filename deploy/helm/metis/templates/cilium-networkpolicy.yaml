{{- /*
Cilium NetworkPolicy — sub-issue #371, reworked in #1374.
Renders only when networkPolicy.cilium.enabled=true, NEXT TO the vanilla
policies in networkpolicy.yaml (which keep the default-deny and the in-cluster
rules). It grants the server what a vanilla NetworkPolicy cannot express:
HTTPS to an FQDN allow-list (AI gateways, GitHub, `extraFqdns`) and the
kube-apiserver entity, so networkpolicy.yaml leaves out its 0.0.0.0/0 ipBlocks
in this mode. Selects the server only: no other pod leaves the cluster.
*/ -}}
{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.cilium.enabled .Values.server.enabled -}}
{{- $fullname := include "metis.fullname" . -}}
{{- $egress := .Values.networkPolicy.egress -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ printf "%s-server-fqdn-egress" $fullname }}
  labels:
    {{- include "metis.labels" (dict "root" . "component" "netpol") | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "metis.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  egress:
    # In-cluster DNS, through Cilium's DNS proxy: toFQDNs only learns the
    # addresses of names it saw resolved here.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API (k8s-sse MCP runtime).
    - toEntities:
        - kube-apiserver
    # FQDN-scoped HTTPS to AI gateways + GitHub (+ extraFqdns).
    - toFQDNs:
        {{- range (concat $egress.aiGateways $egress.githubHosts ($egress.extraFqdns | default list)) }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            {{- range $egress.https.ports }}
            - port: "{{ if kindIs "map" . }}{{ .port }}{{ else }}{{ . }}{{ end }}"
              protocol: TCP
            {{- end }}
{{- end }}
