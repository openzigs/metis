# ==============================================================================
# METIS — Local SAML test harness (Issue #523, Epic #517).
#
# Runs boxyhq/mock-saml as a local SAML 2.0 Identity Provider so a developer can
# exercise METIS's SAML login end-to-end (including the #520 response-signing /
# replay hardening) WITHOUT a real corporate IdP.
#
# WHY boxyhq/mock-saml (not kristophjunge/test-saml-idp):
#   - Actively maintained (releases through Dec 2025) vs SimpleSAMLphp 1.15.2
#     (2017) in kristophjunge/test-saml-idp.
#   - Its @boxyhq/saml20 createSAMLResponse signs BOTH the Assertion AND the
#     Response envelope, so METIS's #520 secure default `requireSignedResponse:
#     true` (wantAuthnResponseSigned) works WITHOUT relaxing it. A mock that only
#     signed the assertion would force every local dev to set
#     requireSignedResponse=false, weakening the thing this harness exists to test.
#
# This compose ONLY runs the IdP. Run your METIS server the usual way (AUTH_MODE
# stays `mock` — SAML login does not depend on AUTH_MODE; the SSO routes read the
# stored provider config). Then seed the provider:
#
#   make saml-up        # generate keys, start the mock IdP, seed METIS
#   make saml-down      # stop the mock IdP
#
# or directly:
#
#   bash scripts/saml-harness/up.sh
#
# The signing keypair is generated by scripts/saml-harness/up.sh into
# scripts/saml-harness/.keys/ (gitignored) and injected via the env vars below.
# Without PUBLIC_KEY/PRIVATE_KEY the mock cannot sign and the metadata carries no
# cert (the seed script fails loudly).
# ==============================================================================

services:
  saml-idp:
    image: boxyhq/mock-saml:1.4.2
    container_name: metis-mock-saml-idp
    ports:
      # Host 4500 -> container 4000. mock-saml serves on 4000 internally; we
      # publish on 4500 so it never collides with the METIS server's host :4000.
      - "4500:4000"
    environment:
      # The public APP_URL the IdP advertises in metadata + SSO redirects. Must
      # match the host port mapping so METIS (and the browser) can reach it.
      APP_URL: ${SAML_IDP_APP_URL:-http://localhost:4500}
      ENTITY_ID: ${SAML_IDP_ENTITY_ID:-https://saml.metis.local/idp}
      # Base64-encoded PEM signing material (generated by up.sh). REQUIRED — the
      # mock has no fallback key (verified in boxyhq/mock-saml utils/certificate.ts);
      # with these empty it signs with an empty key and metadata has no cert.
      PUBLIC_KEY: ${SAML_IDP_PUBLIC_KEY:-}
      PRIVATE_KEY: ${SAML_IDP_PRIVATE_KEY:-}
      NEXT_PUBLIC_GTM_ID: ""
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:4000,path:'/api/saml/metadata',timeout:4000},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
