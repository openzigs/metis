# Docs site: renders every Markdown file under docs/ with MkDocs Material
# (mkdocs.yml) and deploys it to GitHub Pages at https://openzigs.github.io/metis/.
# Pull requests that touch the docs only build it, so a broken config fails
# before merge; pushes to main build and deploy.
#
# SUPPLY-CHAIN NOTE (#586): every `uses:` is pinned to a full 40-char commit SHA.
name: docs-site

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "scripts/docs-site/**", ".github/workflows/docs-site.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "scripts/docs-site/**", ".github/workflows/docs-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/docs-site/requirements.txt
      - run: pip install -r scripts/docs-site/requirements.txt
      - run: mkdocs build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
