name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # #844 — nightly full run. `postgres-adapter` and the `api` image build/smoke
  # are path-gated on pull requests (see the `changes` job); this run, and every
  # push to `main`, always does both, so whatever the path lists miss is caught
  # within a night. Scheduled runs use the default branch's copy of this file.
  schedule:
    - cron: "17 4 * * *"

# #844 — the nightly run gets its OWN group: sharing `ci-refs/heads/main` would
# let a merge to `main` cancel the nightly half-way (or the nightly cancel the
# merge's run). Every other event keeps exactly `ci-${{ github.ref }}`.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: true

# Least privilege, stated rather than inherited from the repository default (which
# is `read` today but is a setting, not a property of this file). No job here
# writes to the repository; the image builds' `type=gha` cache uses the runtime
# token, which this does not govern.
permissions:
  contents: read

# Every job runs on a GitHub-hosted runner. Standard runners are FREE and
# uncapped on public repositories. Larger runners are charged EVEN on public
# repositories, so do not reach for one to recover speed — cache instead.

jobs:
  # #844 — which conditional work this run needs. Pure logic and its reasoning:
  # scripts/lib/ci-changes-core.mjs; the pinned path lists are there too.
  #   postgres: run `postgres-adapter`
  #   images:   run the `api` job's image build, size gate and container smoke
  # Both are always `true` on push, schedule and workflow_dispatch, and on a PR
  # whose diff cannot be computed (fail-open). Consumers compare `!= 'false'`,
  # not `== 'true'`, so an EMPTY output (this job failed) also runs the work.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      postgres: ${{ steps.classify.outputs.postgres }}
      images: ${{ steps.classify.outputs.images }}
    steps:
      # A PR run checks out the MERGE commit; depth 2 brings its first parent
      # (the base tip), which is what the diff is taken against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Classify changed paths
        id: classify
        run: node scripts/ci-changes.mjs

  api:
    runs-on: ubuntu-latest
    # #844 — needs `changes` for the image-step gate only. `!cancelled()` so a
    # FAILED `changes` job still lets lint/typecheck/tests run (and the image
    # steps too: their `!= 'false'` gate reads an empty output as "run").
    needs: [changes]
    if: ${{ !cancelled() }}
    # A wedged docker build previously held the runner for HOURS: with no
    # `timeout-minutes`, GitHub's 6-hour default applies, and cancelling does not kill
    # a hung `docker build` promptly. The image builds below now cache across runs
    # in the GitHub Actions cache (#3), so a warm run no longer rebuilds every
    # layer. The bound has to survive a COLD run (first build after a cache
    # eviction). #4 — measured: the whole job was 27-31 min on `main` while its
    # Test step ran the entire monorepo (816 s); with the scoped step below (18 s)
    # it ran 13m12s-18m45s over three runs on #4's branch. A cold build adds ~6 min
    # over warm (13m30s vs 7m25s for the four images, docs/OPERATIONS.md >
    # "Container Image Sizes" > "CI build cache"), so ~20-25 min cold; 40 keeps
    # roughly the 2x headroom 60 had over the old 28-minute cold run.
    timeout-minutes: 40
    # #801 follow-up — the `api` job builds FOUR Docker images on the SHARED
    # shared daemon. Run-scoped tags (#801) stopped concurrent runs from
    # deleting each other's images, but they did not stop the two builds from
    # CONTENDING for that one daemon: with the clobbering removed, both runs now
    # proceed to a full build and wedge. Observed on PRs #809/#810 — "Build
    # container images" stuck at 2h51m and 2h01m, against ~17m for the ENTIRE job
    # normally. (Before #801 the loser failed fast instead, which hid this.)
    #
    # NO `api-docker-build` concurrency group any more. It serialised this job
    # across every ref because the self-hosted runners SHARED ONE Docker daemon
    # and could only do one image build at a time — queueing was honest there.
    # Each GitHub-hosted job gets its own VM with its own daemon, so the group
    # would now only make independent builds wait for each other, for nothing.
    #
    # It is also what made `api` read as `fail` when it was merely cancelled,
    # which is why `api-outcome` exists to disambiguate. That job is kept: a
    # supersede by a newer push to the same ref can still cancel this one.
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Clean stale artifacts
        run: rm -rf node_modules dist

      # GitHub-hosted runner: nothing is pre-installed beyond the image, so the
      # Node version is pinned here and Corepack provides pnpm.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build shared packages
        run: pnpm --filter @metis/shared run build

      - name: Lint
        run: pnpm lint
        env:
          # The private-vocabulary gate's list. Fork pull requests receive no secrets,
          # so for them the gate skips (and says so); everywhere the secret SHOULD
          # exist, a missing one fails the step instead of passing unchecked.
          METIS_PRIVATE_TERMS: ${{ secrets.METIS_PRIVATE_TERMS }}
          METIS_REQUIRE_PRIVATE_TERMS: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      # Issue #1142 — Claude Code only discovers skills under `.claude/skills/`,
      # but the skill bodies live once in `.github/skills/` (the Copilot
      # convention every agent file already references by path). The bridge is a
      # committed symlink per skill. Nothing about that is self-evident from a
      # diff, and a skill added to `.github/skills/` without a link fails
      # SILENTLY — an undiscovered skill is indistinguishable from one the model
      # chose not to use. That is exactly how 12 of 13 ended up invisible.
      - name: Verify skill discovery links
        run: pnpm skills:verify

      # Issue #1146 — subagent frontmatter is paid on every delegation and
      # fails silently: a misspelled key, a bad model alias, or a `description`
      # that YAML truncated at an inline ` #` all load without complaint. This
      # also pins the invariant that CLAUDE.md's agent table names exactly the
      # agents on disk — #1145 deleted one and left a dangling reference behind.
      - name: Verify agent frontmatter
        run: pnpm agents:verify

      - name: Typecheck
        run: pnpm typecheck

      # #4 — ONLY the suites no other job runs: scripts, shared, ui-kit and
      # embeddings-svc (18 s measured on PR #287's run). This step used to be the root `pnpm test` — the
      # WHOLE monorepo — which was 86% of this job's wall clock and re-ran the ui
      # suite (the `ui` job runs it) and the server suite (now the `server` job).
      #
      # Exclusions, not an allowlist, so a NEW package is tested here by default
      # rather than by nobody. `!metis` is load-bearing: only-negative filters
      # typed at the root select the root package too, and the root's own `test`
      # script is the whole-monorepo fan-out — without it this step silently runs
      # everything again (measured on #4). `ci-test-ownership-repo.test.mjs`
      # fails when any package's suite runs in no job or in two.
      - name: Test (packages no other job tests)
        run: pnpm -r --filter '!metis' --filter '!@metis/e2e' --filter '!@metis/ui' --filter '!@metis/server' run test

      # #844 — say so, in the log and the job summary, when the image work is
      # skipped: a green `api` must not read as "images built and smoked".
      - name: Report skipped image build
        if: ${{ needs.changes.outputs.images == 'false' }}
        run: |
          echo "::notice title=api image build skipped (#844)::No image-relevant paths changed on this PR, so the image build, size gate and smoke were skipped. They always run on main and nightly."
          echo "- Image build, size gate and smoke: **skipped** — no image-relevant paths changed (see the \`changes\` job)." >> "$GITHUB_STEP_SUMMARY"

      # #3 — a run on main ran OUT OF DISK building these ("Free space left:
      # 55 MB"). Drop the preinstalled toolchains this job never uses (.NET,
      # Android SDK, GHC, CodeQL bundles, the runner's cached Docker images)
      # before building. Measured on #38: 83 GB -> 110 GB free, in 1m21s.
      # Runs on Dependabot PRs too (#51): they build and smoke metis-server.
      - name: Free runner disk for image builds
        if: ${{ needs.changes.outputs.images != 'false' }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          docker image prune --all --force > /dev/null
          df -h /

      - name: Set up Buildx
        if: ${{ needs.changes.outputs.images != 'false' }}
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # Issue #145 — image-size budget gate. The `metis-embeddings` sidecar is
      # built but exempt from the cap (see docs/OPERATIONS.md > "Container
      # Image Sizes").
      #
      # Budget note (#34): metis-ui is gated at ≤350 MB. metis-server is held to
      # its OWN measured amd64 budget (DEFAULT_MAX_SERVER_IMAGE_MB) — the old
      # ~329 MB figure was never re-measured as the image grew. The budget is the
      # measured size of an image that STARTS (#39, smoke step below) plus
      # headroom; the breakdown is in docs/OPERATIONS.md > "Container Image Sizes".
      #
      # This gate previously allowed 1200 MB. That was NOT the real budget — it
      # was an arm64 allowance, because the runner was arm64 and a
      # native pnpm install there pulled in ~650 MB of arm64-specific platform
      # binaries (@lancedb, @napi-rs/canvas, and the since-removed Copilot SDK) that the amd64
      # equivalents do not carry. GitHub-hosted runners are amd64, so the build
      # is native and the documented amd64 budget applies again. Leaving 1200
      # here would have left the gate 3.4x looser than intended, silently
      # passing regressions it exists to catch.
      #
      # #3 — the builds cache across runs in the GitHub Actions cache
      # (`type=gha`). They used to be plain `docker build`, relying on the
      # daemon's layer cache, which was a property of the old self-hosted
      # machine: a hosted runner is a fresh VM with an empty daemon every time,
      # so every build was cold. `type=gha` needs a docker-container buildx
      # builder, which is what the plain build deliberately avoided — its
      # moby/buildkit bootstrap hung on the self-hosted daemon. That hang was a
      # property of that daemon too; `build-images.yml` bootstraps the same
      # builder on hosted runners. Each image caches under its own `scope`, and
      # `mode=max` so the multi-stage builders' intermediate layers (the pnpm
      # install) are cached, not only the final stage.
      #
      # Dependabot PRs (#51): metis-server IS built and smoked for them. A
      # dependency bump is the likeliest cause of the next server image that will
      # not start (#39 was a runtime dependency; #45 a Prisma client), and skipping
      # it here meant such a bump first failed on `main`. The other three images and
      # the size gate still skip Dependabot PRs: rebuilding every image per bump is
      # the single heaviest CI cost, `build-images.yml` skips Dependabot for the same
      # reason, and full image validation still runs on every other PR and on `main`.
      #
      # Issue #509 — `provenance: false` / `sbom: false` on every gate build.
      # BuildKit adds a `mode=min` provenance attestation by DEFAULT, which wraps
      # the result in an OCI image INDEX carrying an extra `unknown/unknown`
      # attestation manifest. `docker image inspect <tag> --format '{{.Size}}'`
      # then returns EMPTY for that tag (an index has no single `.Size`), so the
      # size gate intermittently reported `metis-server:test: image not found or
      # zero size` even though the build succeeded — the recurring image-size
      # flake. This is a SIZE-REGRESSION gate, not a release artifact (the
      # authoritative multi-arch + provenance build lives in build-images.yml), so
      # disabling attestations here is correct: each build becomes a plain
      # single-platform image whose `{{.Size}}` is reliably populated.
      # `load: true` puts each image in the runner's daemon so the size gate
      # below can `docker image inspect` it. #801 — run-scoped tag.
      - name: Build metis-server
        if: ${{ needs.changes.outputs.images != 'false' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.server
          tags: metis-server:ci-${{ github.run_id }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=metis-server
          # `ignore-error=true` because this step also runs for Dependabot PRs
          # (#51), whose restricted token usually cannot WRITE the Actions cache.
          # BuildKit reports a refused cache export as a failed build step, which
          # would turn every Dependabot PR red — worse than the skip it replaced.
          cache-to: type=gha,scope=metis-server,mode=max,ignore-error=true

      - name: Build metis-ui
        if: ${{ needs.changes.outputs.images != 'false' && !startsWith(github.head_ref, 'dependabot/') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.ui
          tags: metis-ui:ci-${{ github.run_id }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=metis-ui
          cache-to: type=gha,scope=metis-ui,mode=max

      # BAKE_MODELS=0: this is the image-size regression gate, not the release
      # artifact (that's build-images.yml on tag push). Baking downloads models
      # from HuggingFace at build time, which flakes on the runner; skip it
      # here. The sidecar downloads at runtime.
      - name: Build metis-embeddings
        if: ${{ needs.changes.outputs.images != 'false' && !startsWith(github.head_ref, 'dependabot/') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.embeddings
          build-args: |
            BAKE_MODELS=0
          tags: metis-embeddings:ci-${{ github.run_id }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=metis-embeddings
          cache-to: type=gha,scope=metis-embeddings,mode=max

      # Epic #294 — the metis-sql-lineage sidecar (Python + sqlglot). Pure
      # Python, NO model bake / NO heavy native deps, so this build is fast and
      # cannot reintroduce the model-bake flake fixed in #290.
      - name: Build metis-sql-lineage
        if: ${{ needs.changes.outputs.images != 'false' && !startsWith(github.head_ref, 'dependabot/') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.sql-lineage
          tags: metis-sql-lineage:ci-${{ github.run_id }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=metis-sql-lineage
          cache-to: type=gha,scope=metis-sql-lineage,mode=max

      # metis-server is held to its own measured budget (#34,
      # DEFAULT_MAX_SERVER_IMAGE_MB in scripts/lib/verify-image-size.mjs);
      # metis-ui stays on the general 350.
      - name: Verify image size budget
        if: ${{ needs.changes.outputs.images != 'false' && !startsWith(github.head_ref, 'dependabot/') }}
        env:
          MAX_IMAGE_MB: "350"
          IMAGE_TAG: "ci-${{ github.run_id }}" # #801 — must match the build step
        run: node scripts/lib/verify-image-size.mjs --no-build

      # #39 — the image must RUN, not just build and weigh. `main` shipped a
      # metis-server that exited at import time (a runtime dependency declared as a
      # devDependency, a pruned `@prisma/debug`, a glibc-only LanceDB binding on a
      # musl base) while every gate here was green, because nothing ever started it.
      # This starts the built image with its own CMD, polls /healthz until 200, then
      # loads inside the running container the native/lazy modules /healthz never
      # touches (LanceDB, mysql2, better-sqlite3, Oracle thick mode) and checks the
      # runtime user can write its home directory. A container that exits, a
      # /healthz that never answers, or a probe that fails fails the job, with the
      # container log printed.
      #
      # #45 — it does that TWICE: on SQLite with no DATABASE_URL (the server's own
      # default), and on Postgres, the documented production topology — the script
      # starts a pgvector/pgvector:pg16 container (the image the postgres-* jobs use)
      # on a private docker network, boots the image against it, and checks that
      # every Postgres migration is applied and that the server's own Prisma client
      # reads a migrated table. Until #45 that arm exited at import. #54 — the LanceDB
      # and uploads probes write through the server's own code to its own default
      # paths, not to /tmp.
      #
      # #60 — the Postgres arm runs VECTOR_STORE=pgvector, the production Helm
      # setting, and probes the pgvector store; a third arm, `helm-default`, boots the
      # image under the Helm chart's DEFAULT values (read-only root filesystem, uid
      # 1001, no DATABASE_URL, writable only where the chart mounts a volume).
      # #51 — runs on Dependabot PRs too, and passes its per-run secrets through
      # docker's environment rather than its command line.
      - name: Smoke-test metis-server (starts, serves /healthz)
        if: ${{ needs.changes.outputs.images != 'false' }}
        run: node scripts/lib/smoke-server-image.mjs --image "metis-server:ci-${{ github.run_id }}" --timeout 180

      - name: Clean up test images
        if: ${{ always() && needs.changes.outputs.images != 'false' }}
        env:
          # #801 — run-scoped tag, STEP-scoped on purpose: at job level it also
          # reaches `pnpm test`, whose verify-image-size mocks key on the default
          # `:test` tag.
          IMAGE_TAG: "ci-${{ github.run_id }}"
        run: |
          # #801 — remove only THIS run's images. A bare `metis-server:test` here
          # deleted a CONCURRENT run's image on a shared daemon.
          docker rmi "metis-server:${IMAGE_TAG}" "metis-ui:${IMAGE_TAG}" "metis-embeddings:${IMAGE_TAG}" "metis-sql-lineage:${IMAGE_TAG}" 2>/dev/null || true
          docker buildx prune -f --keep-storage=4g

      # Issue #1067 — a CANCELLED `api` job is rendered by `gh pr checks` as
      # `fail`, indistinguishable from a broken test suite. Observed 6 times in
      # one session; one job was superseded after 41s having built nothing and
      # still read as a failure, costing a ~17-minute re-run to prove nothing
      # was wrong. The cross-ref serialization is gone (see the comment on this
      # job); a newer push to the same ref still cancels it, so the REPORTING stays.
      #
      # This step covers a job cancelled while RUNNING. A job cancelled while
      # still QUEUED never starts a runner, so no step of it can ever run — the
      # `api-outcome` job below is what covers that case.
      - name: Report concurrency supersede
        if: ${{ cancelled() }}
        run: |
          echo "::notice title=api superseded — NOT a test failure::This api job was cancelled, not broken. See the job summary."
          {
            echo "### \`api\`: CANCELLED — superseded, not a test failure"
            echo
            echo "The workflow's concurrency group is \`ci-<ref>\` with"
            echo "\`cancel-in-progress: true\`, so a newer push to this branch cancelled"
            echo "this run — that supersede is what you are looking at."
            echo
            echo "\`gh pr checks\` renders a \`cancelled\` conclusion as **fail**. Nothing in"
            echo "the tree needs fixing: read the newer run. Re-run this job only if no"
            echo "newer run for the branch exists (e.g. it was cancelled by hand)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Issue #1067 — turns the `api` job's raw conclusion into a signal a human can
  # read WITHOUT a manual `gh api .../jobs/<id>` call. It is the only place that
  # can speak for an `api` job cancelled while still queued (that job never gets
  # a runner, so it has no steps of its own to report with).
  #
  # Contract, visible directly in `gh pr checks`:
  #   api-outcome pass + api fail  -> `api` was CANCELLED (superseded). Read the newer run.
  #   api-outcome fail             -> `api` genuinely FAILED. Read the log.
  api-outcome:
    name: api-outcome
    runs-on: ubuntu-latest
    needs: [api]
    # `always()` (not `!cancelled()`) on purpose: reporting the cancellation IS
    # this job's whole purpose, so it must survive one.
    if: always()
    timeout-minutes: 5
    steps:
      - name: Classify api outcome
        env:
          API_RESULT: ${{ needs.api.result }}
        run: |
          case "$API_RESULT" in
            success)
              echo "api: success"
              echo "- \`api\`: **success**" >> "$GITHUB_STEP_SUMMARY"
              ;;
            cancelled)
              echo "::notice title=api superseded — NOT a test failure::The api job was CANCELLED by a newer push to this ref (or by hand), not by a failing test. gh pr checks shows a cancelled conclusion as 'fail'. Nothing in the tree needs fixing; read the newer run, or re-run this job if there is none."
              {
                echo "### \`api\`: CANCELLED — superseded, **not** a test failure"
                echo
                echo "The workflow's concurrency group is \`ci-<ref>\` with"
                echo "\`cancel-in-progress: true\`, so a newer push to this branch cancels"
                echo "the running \`api\` job — often before it has built anything."
                echo
                echo "\`gh pr checks\` prints a \`cancelled\` conclusion as **fail**. That red"
                echo "\`api\` line is a supersede, not a defect: read the newer run. Re-run"
                echo "\`api\` only if no newer run for the branch exists."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            skipped)
              echo "api: skipped"
              echo "- \`api\`: skipped" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error title=api FAILED — a real failure::The api job concluded '$API_RESULT'. This is NOT a concurrency supersede; read the api job log."
              {
                echo "### \`api\`: \`$API_RESULT\` — a real failure"
                echo
                echo "This is **not** a concurrency supersede. Read the \`api\` job log."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

  ui:
    runs-on: ubuntu-latest
    # Normal runtime ~7 min. Bound it so a hang cannot hold a runner for 6 hours.
    timeout-minutes: 30
    env:
      NPM_CONFIG_PRODUCTION: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Clean stale artifacts
        run: rm -rf node_modules ui/node_modules ui/.next

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build shared packages
        run: pnpm --filter @metis/shared run build

      - name: Lint UI
        working-directory: ui
        run: pnpm lint

      - name: Test UI
        working-directory: ui
        run: pnpm test

      - name: Build UI
        working-directory: ui
        run: pnpm build

  # #4 — the server unit suite on the DEFAULT (SQLite) Prisma client, moved out of
  # `api`. It used to run inside `api`'s root `pnpm test`, concurrently with the ui
  # suite on the same runner (~12.5 min there); here it has a runner to itself and
  # runs in parallel with `api`'s image builds instead of ahead of them.
  #
  # It is NOT a duplicate of `postgres-adapter`, which runs the same files against
  # the POSTGRES-generated client: there 15 files (321 tests, PR #287) skip themselves —
  # every `*.sqlite.test.ts` among them. Measured on #4 by comparing the per-file
  # results of both jobs, not their totals. `ci-test-ownership-repo.test.mjs`
  # keeps the ownership honest.
  server:
    runs-on: ubuntu-latest
    # 9m04s measured for the whole job on PR #287's run (36336030407). 20 bounds a
    # hang without cutting a slow cold run.
    timeout-minutes: 20
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Clean stale artifacts
        run: rm -rf node_modules dist

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build shared packages
        run: pnpm --filter @metis/shared run build

      - name: Test server (SQLite client)
        working-directory: server
        run: pnpm test

      # #456 — the exporter tests that need a REAL headless Chromium to render a
      # PDF / DOCX (moved out of the unit fan-out by #447 / PR #451, which ran them
      # nowhere). Install the Chrome build puppeteer pins, explicitly rather than
      # trusting its postinstall download, then run the suite on its own, after the
      # unit suite, so the Chromium spawn does not contend with vitest workers
      # (#388). The suite asserts the PDF / DOCX unconditionally, so a Chromium that
      # cannot launch (the exporter degrades to HTML) fails this step. The runner
      # image already carries Chrome's system libraries. Guarded by
      # scripts/lib/ci-real-chromium-repo.test.mjs.
      - name: Install puppeteer's Chrome
        working-directory: server
        run: pnpm exec puppeteer browsers install chrome

      - name: Test exporters against a real Chromium
        working-directory: server
        run: pnpm test:integration exporters-real-chromium

  # Epic #294 (#303) — metis-sql-lineage Python sidecar checks.
  #
  # Issue #1191 — a PR that changes source must add ONE changelog fragment under
  # `.changes/unreleased/`, instead of every PR appending to the same anchor in
  # `CHANGELOG.md` (996 entries, 1.65 MB) and conflicting by construction.
  #
  # This is a SEPARATE job on purpose, for two reasons:
  #  1. `lint` / `skills:verify` / `agents:verify` live in the `api` job, which
  #     builds four Docker images and takes ~17-21 min. This gate exists to stop
  #     wasted CI cycles, so reporting it after a 20-minute build defeats it.
  #  2. It needs `fetch-depth: 0`. The default checkout is shallow and has no
  #     `origin/main`, so the diff has no base — and the runner FAILS rather than
  #     skipping in that case (a gate that passes when it cannot find its
  #     comparison point is worse than no gate). Putting the full fetch on a job
  #     that does nothing else keeps it off the contended `api` job.
  #
  # No `pnpm install`: the verifier is plain Node using only builtins, so the
  # whole job is a checkout plus a few seconds.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # `CHANGELOG_PR_AUTHOR` carries the ONE signal the diff cannot supply: who
      # opened the PR (#1270). Dependabot has no step in which it could write a
      # fragment, so before this the gate failed all ten open dependabot PRs and
      # enforced nothing — a permanently-red check carries the same information
      # as an ignored one. The exemption is the intersection of this author and a
      # dependency-manifest path; see DEPENDENCY_MANIFEST_RULES.
      #
      # `github.event.pull_request.user.login` comes from the PR record, not the
      # branch, and expands to the EMPTY STRING on `push` and `workflow_dispatch`
      # — where the verifier's strict mode is the correct reading anyway.
      - name: Verify changelog fragment
        env:
          CHANGELOG_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/verify-changelog-fragment.mjs

  # Dedicated job: lint (ruff) + unit tests (pytest) with an 80% coverage floor
  # (--cov-fail-under=80) on the new Python service. Runs on the same
  # macOS runner (Python 3 is pre-installed). It is intentionally LEAN and fast:
  # sqlglot + FastAPI + uvicorn + pydantic are all pure-Python wheels with NO
  # model downloads, so the install cannot reintroduce the build-time model-bake
  # flake fixed in #290. The Docker image for this service is built in the `api`
  # job's image-size gate (Dockerfile.sql-lineage).
  sql-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: metis-sql-lineage
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      # NOTE: do NOT use actions/setup-python here. This dates from a macOS
      # runner that action hardcodes the GitHub-hosted tool-cache path
      # (/Users/runner/...), which is not writable on this runner and fails with
      # "mkdir: /Users/runner: Permission denied". The runner image's python3
      # in this repo uses the runner's PRE-INSTALLED tooling directly; the
      # Semgrep job in sast.yml follows the same venv-from-system-python3
      # pattern. The sidecar targets py311/py312 and depends only on pure-Python
      # wheels (sqlglot, fastapi, uvicorn, pydantic), so the runner's
      # pre-installed python3 is sufficient — nothing here must be downloaded.
      - name: Show Python version
        run: python3 --version

      - name: Create venv and install pinned dev deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Ruff lint
        run: .venv/bin/ruff check .

      - name: Pytest with coverage gate (>=80%)
        run: .venv/bin/pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  # Issue #539 (Epic #518) — proof that the scheme-selected Prisma adapter
  # actually connects to a REAL Postgres when given a `postgres://` DATABASE_URL.
  #
  # The keystone multi-replica fix changes server/src/lib/prisma.ts to pick the
  # adapter by DATABASE_URL scheme (PrismaPg for postgres(ql)://, better-sqlite3
  # for file:/sqlite:). The unit tests (server/src/lib/prisma.test.ts) prove the
  # SELECTION logic; this job proves the postgres branch genuinely talks to
  # Postgres (not SQLite) end-to-end:
  #   1. spin up postgres:16-alpine (same image as docker-compose),
  #   2. apply prisma/postgres migrations via `db:migrate:postgres`,
  #   3. regenerate the Prisma client for the postgres schema,
  #   4. run the gated integration test (RUN_INTEGRATION_TESTS=1 + a postgres
  #      DATABASE_URL) which issues `SELECT version()` and asserts "PostgreSQL".
  #
  # Runs on a GitHub-hosted Linux runner; the postgres service is a Docker
  # container the runner host provides (same Docker daemon the image-size gate
  # uses). It is intentionally NOT a heavy job — no image builds, no UI.
  #
  # #844 — on a PR this job runs only when `changes` reports a Postgres-relevant
  # path (scripts/lib/ci-changes-core.mjs, POSTGRES_PATTERNS); otherwise its check
  # still appears, as `skipping`. It always runs on push to `main`, nightly and on
  # dispatch. `!cancelled()` plus `!= 'false'` keep a FAILED `changes` job from
  # silently skipping it: an empty output runs the job.
  postgres-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.postgres != 'false' }}
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
      # DATABASE_URL is NOT set here (#754): the postgres service now binds an
      # EPHEMERAL host port, and the `job` context that exposes it is not
      # available in job-level `env`. The "Resolve Postgres URL" step below
      # exports it to $GITHUB_ENV before any step needs it.
      RUN_INTEGRATION_TESTS: "1"
    services:
      postgres: # postgres-adapter
        # Issue #543 (Epic #518) — pgvector image (a drop-in superset of the
        # stock postgres image) so the gated pgvector integration test can
        # `CREATE EXTENSION vector`. Same user/pass/db as docker-compose.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: metis
          POSTGRES_PASSWORD: metis
          POSTGRES_DB: metis
        # #754 — bind an EPHEMERAL host port, not a fixed 5432. Both postgres
        # jobs run on the SAME runner and share one Docker daemon
        # and one host port space, so a fixed `5432:5432` made them race:
        # whichever container started second died with
        #   "Bind for 0.0.0.0:5432 failed: port is already allocated".
        # The mapping cannot simply be dropped — these jobs run on the runner
        # host (no job-level `container:`), so the `postgres` network alias is
        # not resolvable; they must reach it over localhost.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U metis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # #754 — the postgres service binds an EPHEMERAL host port (see `ports:`
      # above). The `job` context that exposes the mapped port is NOT available
      # in job-level `env:`, so resolve DATABASE_URL here and export it for
      # every subsequent step. Must stay ahead of any step that touches the DB.
      - name: Resolve Postgres URL (ephemeral host port)
        run: |
          port='${{ job.services.postgres.ports['5432'] }}'
          if [ -z "$port" ]; then
            echo "::error::postgres service exposed no host port for 5432"
            exit 1
          fi
          echo "DATABASE_URL=postgresql://metis:metis@localhost:${port}/metis" >> "$GITHUB_ENV"
          echo "Postgres mapped to host port ${port}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Clean stale artifacts
        run: rm -rf node_modules dist

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build shared packages
        run: pnpm --filter @metis/shared run build

      # Sync the Postgres schema. `prisma.config.ts` resolves the schema +
      # migrations dir by the DATABASE_URL scheme (postgres -> prisma/postgres),
      # so no --schema flag is needed. We use `db push` rather than
      # `migrate deploy` here because it syncs the schema state directly from
      # prisma/postgres/schema.prisma — this proof job only needs a live Postgres
      # with the schema present to exercise the scheme-selected adapter; it does
      # not validate the (separately tracked) postgres migration history.
      - name: Sync Postgres schema
        working-directory: server
        run: pnpm prisma db push

      - name: Generate Prisma client for Postgres schema
        working-directory: server
        run: pnpm prisma generate

      # Issue #876 — the regression gate for a Postgres-CAPABLE unit suite. Everything
      # below this line runs integration suites; this step runs the DEFAULT `pnpm test`
      # against the Postgres-generated client that was just produced. Before #876 that
      # combination failed 219 of 952 test files at import ("The Driver Adapter
      # @prisma/adapter-better-sqlite3 ... is not compatible with the provider postgres"),
      # which is exactly why dev-on-Postgres needed a `prisma generate` toggle before every
      # test run. Nothing else in CI covers it: the `api` job only ever builds the SQLite
      # client. Without this gate, provider-agnosticism would silently rot on the next PR
      # that lets an ambient DATABASE_URL leak into a unit test.
      - name: Prove the unit suite runs on the Postgres-generated client
        working-directory: server
        run: pnpm test

      - name: Prove real Postgres connection via scheme-selected adapter
        working-directory: server
        run: pnpm test:integration prisma-postgres-connection

      # Issue #541 (Epic #518) — prove the Postgres-backed shared rate-limit
      # store enforces the discussion AI-invocation cap CLUSTER-WIDE (not Nx)
      # against the same real Postgres, via a genuine two-replica concurrent
      # race. The store self-creates its UNLOGGED counter table (no migration).
      - name: Prove cluster-wide rate-limit enforcement on real Postgres
        working-directory: server
        run: pnpm test:integration rate-limit-store-postgres

      # Issue #542 (Epic #518) — prove the Postgres-backed SSO transaction-state
      # store gives cross-replica login continuity (state put on one pod is
      # consumed on another) AND consume-once replay protection against the same
      # real Postgres. The store self-creates its UNLOGGED table (no migration).
      - name: Prove cross-replica SSO-state continuity on real Postgres
        working-directory: server
        run: pnpm test:integration sso-state-store-postgres

      # Issue #520 (Epic #517) — prove the Postgres-backed SAML request-id cache
      # gives cross-replica InResponseTo / replay protection against the same real
      # Postgres: a request id saved on one pod is visible on another, is
      # single-use (remove makes a replay get miss), and expires past its TTL. The
      # cache self-creates its UNLOGGED table behind an advisory lock (no migration).
      - name: Prove cross-replica SAML request-id cache on real Postgres
        working-directory: server
        run: pnpm test:integration saml-request-id-cache-postgres

      # Issue #622 — prove the Socket.IO Postgres cluster adapter carries a SCIM
      # deprovision disconnect and the MCP status evictions to a socket held by
      # ANOTHER replica (two servers, two pools, one real Postgres LISTEN/NOTIFY),
      # and relays an over-8000-byte emit through its self-created attachments table.
      - name: Prove cross-replica socket evictions on real Postgres
        working-directory: server
        run: pnpm test:integration socket-cluster-adapter-postgres

      # Issue #112 — prove the #93 config-secret upsert on real Postgres: save →
      # clear → save revives the SAME soft-deleted row (the unique `secrets.name`
      # still holds it). #122 — independent VaultService writers racing first saves
      # of one name all succeed and leave one row; a control arm proves the harness
      # really races. Postgres runs the upsert as one ON CONFLICT statement, so the
      # vault's retry-on-P2002 is NOT reached here (its unit test covers it).
      - name: Prove config secret save/clear/save on real Postgres
        working-directory: server
        run: pnpm test:integration config-secret-vault-postgres

      # Issue #212 — prove the chat transcript's batched fork copy (one createMany)
      # and paged read on real Postgres: same ordinals, compaction re-pointed at
      # the copied summary, a unique-index clash writes nothing, and `hasMore` /
      # compaction updates on a page. The SQLite route suite covers the other adapter.
      - name: Prove transcript fork + paging on real Postgres
        working-directory: server
        run: pnpm test:integration transcript-fork-postgres

      # Issue #402 — `postgres-migrate-deploy` replays the chain from an EMPTY
      # database, so #369's dedupe UPDATE had never met a duplicate row. This runs
      # the #369 and #402 Postgres migration.sql files verbatim over seeded
      # duplicates (in a scratch schema cloned from the pushed tables) and checks
      # which draft survives and that batch draftIds / parentDraftId are repointed.
      - name: Prove the issue-draft dedup migrations on real Postgres duplicates
        working-directory: server
        run: pnpm test:integration issue-draft-dedup-postgres

      # Issue #457 — the same empty-database blind spot for the one-live-primary
      # repo index: runs the Postgres migration.sql verbatim over seeded extra
      # primaries (scratch schema), then races two first repo creates through
      # the real service on the real tables and asserts one primary.
      - name: Prove one primary repository per project on real Postgres
        working-directory: server
        run: pnpm test:integration repo-primary-postgres

      # Issue #474 — the same empty-database blind spot for the documents.source
      # backfill: runs the Postgres migration.sql verbatim over seeded connector
      # and upload rows (scratch schema) and checks each row's classification.
      - name: Prove the document source backfill on real Postgres
        working-directory: server
        run: pnpm test:integration document-source-postgres

      # Issue #525 — generated rows reclassified by their `gendoc-` id: runs the
      # Postgres migration.sql verbatim over seeded rows (scratch schema).
      - name: Prove the generated-document source correction on real Postgres
        working-directory: server
        run: pnpm test:integration generated-source-by-id-postgres

      # Issue #492 — the partial (live-rows-only) repo label index on real
      # Postgres: delete-then-re-add under one label succeeds, a rename onto a
      # live label is a 409 through the real router, including a lost race.
      - name: Prove repo connector label reuse and rename clash on real Postgres
        working-directory: server
        run: pnpm test:integration repo-connector-labels-postgres

      # Issue #495 — the #479 conditional binding update on real Postgres
      # (`updatedAt` is TIMESTAMP(3) there): a PATCH interleaved after another's
      # guard is a 409, and one that loses the race leaves no vault secret. The
      # SQLite twin (vault-secret-binding-479.sqlite.test.ts) skips on this client.
      - name: Prove conditional binding updates on real Postgres
        working-directory: server
        run: pnpm test:integration vault-secret-binding-479-postgres

      # Issue #552 — `markBindingWrite` stamps `bindingWriteUntil` with raw SQL and a
      # confirmed foreign-owner rotation compares it as a typed Date in its
      # conditional UPDATE. Prove the two agree on TIMESTAMP(3), or such a
      # rotation would be refused forever.
      - name: Prove raw binding-write stamps match the rotation's compare-and-set on real Postgres
        working-directory: server
        run: pnpm test:integration vault-rotate-binding-race-552-postgres

      # Issue #601 — on READ COMMITTED the invite accept's guarded consume re-checks
      # only the invite row it locks, so a workspace DELETE committing mid-accept
      # was invisible to it. The DELETE voids the invites in its own transaction;
      # prove an accept blocked behind it gets 410 and adds no member.
      - name: Prove a workspace delete committing mid-accept blocks the invite on real Postgres
        working-directory: server
        run: pnpm test:integration invite-accept-workspace-delete-race-601-postgres

      # Issue #871 — on READ COMMITTED two requirement edits can both read version N
      # inside their transactions. The write is conditional on that version; prove
      # exactly one same-version edit wins and the other is a VERSION_CONFLICT.
      - name: Prove concurrent same-version requirement edits conflict on real Postgres
        working-directory: server
        run: pnpm test:integration requirement-concurrent-edit-871-postgres

      # Issue #543 (Epic #518) — prove the pgvector-backed RAG vector store gives
      # retrieval parity AND multi-replica read/write safety against the same real
      # Postgres: two separately-constructed store instances (= two pods) sharing
      # one DB write AND read concurrently with no corruption (the LanceDB
      # single-writer failure mode is gone). The store self-creates its table +
      # `vector` extension + HNSW index behind an advisory lock (no migration).
      - name: Prove multi-replica pgvector RAG store on real Postgres
        working-directory: server
        run: pnpm test:integration vector-store-pgvector

      # Issue #798 — prove the reindex LEASE against the same real Postgres, through
      # Prisma's real connection POOL (the bug it fixes is invisible to any test that
      # mocks the pool). Covers: take+release are pool-agnostic (the session advisory
      # lock this replaces leaked 8 of 8 locks here, wedging the project until the pod
      # restarted); a SIGKILLed holder's lease expires instead of wedging the next
      # attempt; and #787's no-partial-cutover guarantee still holds under the lease,
      # because a FENCED run is refused at the upsert gate AND inside the swap's own
      # transaction. The backend self-creates its UNLOGGED table (no migration).
      - name: Prove the pool-agnostic reindex lease + fencing on real Postgres
        working-directory: server
        run: pnpm test:integration reindex-lease-postgres

      # Issue #544 (Epic #518) — prove the Postgres-backed leader election gives
      # EXACTLY-ONCE cluster-wide scheduling + CRASH FAILOVER against the same
      # real Postgres: three separately-constructed elector/backend instances
      # (= three pods) sharing one DB elect a single leader, a survivor acquires
      # the lease after the dead leader's TTL expires, and a per-fire window is
      # run by exactly one replica. The backend self-creates its UNLOGGED lease +
      # window tables behind an advisory lock (no migration).
      - name: Prove exactly-once leader election + failover on real Postgres
        working-directory: server
        run: pnpm test:integration leader-election-postgres

      # Issue #779 — a re-synthesis checked for review work, then deleted the set in a
      # separate statement, so a comment committed in between was cascaded away. The
      # set is now locked before the check; prove that comment waits and is refused.
      - name: Prove review work racing a requirement-set replace is never lost on real Postgres
        working-directory: server
        run: pnpm test:integration requirement-set-replace-toctou-779-postgres

  # Issue #556 (Epic #518) — prove the Postgres migration HISTORY applies from
  # an EMPTY database via the real `prisma migrate deploy`.
  #
  # This is the production-deploy proof that the sibling `postgres-adapter` job
  # deliberately does NOT cover: that job uses `prisma db push` (schema sync, no
  # history) to exercise the runtime adapter, which masked a latent collision —
  # the cumulative `00000000000000_init` baseline duplicated DDL that later
  # incremental migrations re-add (first hit: `suggested_connectors.username`,
  # 42701 column already exists). #556 made every incremental migration's
  # structural DDL idempotent; this job is the regression gate. It runs the
  # FULL migration chain on a clean `postgres:16-alpine` and fails if any
  # collision returns. `prisma.config.ts` resolves the schema + migrations dir
  # by the DATABASE_URL scheme (#539), so no --schema flag is needed.
  postgres-migrate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
      # DATABASE_URL is resolved in the "Resolve Postgres URL" step (#754) —
      # the postgres service binds an ephemeral host port and the `job` context
      # exposing it is unavailable in job-level `env:`.
    services:
      postgres:
        # Issue #543 (Epic #518) — pgvector image (a drop-in superset of the
        # stock postgres image) so the gated pgvector integration test can
        # `CREATE EXTENSION vector`. Same user/pass/db as docker-compose.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: metis
          POSTGRES_PASSWORD: metis
          POSTGRES_DB: metis
        # #754 — bind an EPHEMERAL host port, not a fixed 5432. Both postgres
        # jobs run on the SAME runner and share one Docker daemon
        # and one host port space, so a fixed `5432:5432` made them race:
        # whichever container started second died with
        #   "Bind for 0.0.0.0:5432 failed: port is already allocated".
        # The mapping cannot simply be dropped — these jobs run on the runner
        # host (no job-level `container:`), so the `postgres` network alias is
        # not resolvable; they must reach it over localhost.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U metis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # #754 — the postgres service binds an EPHEMERAL host port (see `ports:`
      # above). The `job` context that exposes the mapped port is NOT available
      # in job-level `env:`, so resolve DATABASE_URL here and export it for
      # every subsequent step. Must stay ahead of any step that touches the DB.
      - name: Resolve Postgres URL (ephemeral host port)
        run: |
          port='${{ job.services.postgres.ports['5432'] }}'
          if [ -z "$port" ]; then
            echo "::error::postgres service exposed no host port for 5432"
            exit 1
          fi
          echo "DATABASE_URL=postgresql://metis:metis@localhost:${port}/metis" >> "$GITHUB_ENV"
          echo "Postgres mapped to host port ${port}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Clean stale artifacts
        run: rm -rf node_modules dist

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build shared packages
        run: pnpm --filter @metis/shared run build

      # The actual proof: apply the FULL postgres migration history from an
      # empty database. Before #556 this failed with a 42701 duplicate-column
      # collision; it must now apply every migration with zero collisions.
      - name: Apply full Postgres migration history from scratch
        working-directory: server
        run: pnpm prisma migrate deploy

      # The chain must be a stable no-op on a second run (no drift, no pending
      # migrations) — proves the idempotent guards didn't change recorded state.
      - name: Re-run migrate deploy is a clean no-op
        working-directory: server
        run: |
          out="$(pnpm prisma migrate deploy 2>&1)"
          echo "$out"
          echo "$out" | grep -q "No pending migrations to apply"

      # The deployed schema must match prisma/postgres/schema.prisma — the
      # idempotent guards must not have skipped DDL that the baseline lacked.
      - name: Assert deployed schema matches schema.prisma (no drift)
        working-directory: server
        run: pnpm prisma migrate status

  # Epic #209 (#236) — generative-path e2e + coverage gate.
  #
  # WHY A SEPARATE JOB (not the `e2e` job below): this one runs ONLY the
  # generative loop (`clarify-loop.spec.ts`, #235) in REPLAY mode against the
  # committed LLM fixtures (#234), and pairs it with a scoped coverage gate on
  # the record/replay harness. It is fast and narrow, so it reports on the
  # generative path specifically rather than waiting on the full suite.
  # (Both jobs now run on every PR: #62 removed the `E2E_ENABLED` gate that
  # kept the full `e2e` job switched off.)
  #
  # COVERAGE GATE: the generative-path harness code (`server/src/lib/ai/fixtures`,
  # the net-new #234 record/replay seam the e2e depends on) is held to an 80%
  # unit-coverage floor via a scoped vitest run. We scope the threshold to that
  # module rather than wiring the full-suite `test:coverage` into CI because the
  # repo's global vitest thresholds currently exceed the full suite's actual
  # branch coverage (a pre-existing gap, unrelated to this epic) — enforcing the
  # full gate here would fail on code this epic never touched. The fixtures
  # harness sits at 100% lines/functions/statements today, so this gate is both
  # meaningful for the generative path and deterministically green.
  generative-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
      CI: "true"
      # Belt-and-suspenders: the config already defaults these, but pin them at
      # the job level so the replay contract is explicit and a future config
      # edit can't silently flip the suite to live mode.
      AI_REPLAY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Clean stale artifacts
        run: rm -rf node_modules ui/node_modules ui/.next

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build shared packages
        # @metis/shared must be compiled before the server can boot under the
        # Playwright webServer (tsx resolves @metis/shared/dist at runtime).
        run: pnpm --filter @metis/shared run build

      # Coverage gate for the generative path (#236). Scoped to the net-new
      # record/replay harness the generative e2e exercises. 80% floor, v8
      # provider — consistent with server/vitest.config.ts.
      - name: Generative-path coverage gate
        working-directory: server
        run: >-
          pnpm exec vitest run --coverage
          --coverage.include='src/lib/ai/fixtures/**/*.ts'
          --coverage.thresholds.lines=80
          --coverage.thresholds.branches=80
          --coverage.thresholds.functions=80
          --coverage.thresholds.statements=80
          src/lib/ai/fixtures

      - name: Install Playwright browsers
        # Fetches the browser binary only. The GitHub-hosted Ubuntu image already
        # carries chromium's system libraries (libnss3, libgbm, libasound2, …) —
        # this job passed without `--with-deps` on the first hosted run — so the
        # extra `apt` pass would only add time.
        run: pnpm --filter @metis/e2e exec playwright install chromium

      # Issue #1067 — the Playwright stack defaulted to the FIXED pair
      # 4101 (API) / 3101 (UI). Each runner has its own `_work`
      # directory but they all share one network stack, so a sibling run holding
      # 4101 killed this job with "http://127.0.0.1:4101/healthz is already
      # used". Observed on #1059 and #1079, both with siblings running.
      #
      # `reuseExistingServer: true` (what the error text suggests) would be the
      # WRONG fix — it would run this PR's specs against a stale server from
      # another branch, trading a loud infra failure for a quiet correctness one.
      # Serializing the job would cost wall-clock on every PR. So: give each run
      # its own port pair, derived from GITHUB_RUN_ID and probed for freeness.
      # `E2E_API_PORT` / `E2E_UI_PORT` are already honoured by
      # e2e/playwright.config.ts and e2e/fixtures/api-base.ts.
      - name: Allocate per-run e2e ports
        run: node scripts/allocate-e2e-ports.mjs

      - name: Run generative loop e2e (replay, no live keys)
        # Echo the resolved ports so the log proves concurrent runs got
        # different ones (and so a collision is diagnosable from the log alone).
        run: |
          echo "generative-e2e stack: API=${E2E_API_PORT} UI=${E2E_UI_PORT}"
          pnpm --filter @metis/e2e exec playwright test clarify-loop.spec.ts --project=chromium --reporter=list

      # Epic #129 (#148) — agents and skills end to end: an agent with a skill
      # and a tool allowlist, driven by the offline stub's committed SCRIPT BOOK
      # (real native tool calls, no LLM): the skill loads on demand, an allowed
      # tool runs after approval, a disallowed one is refused. A second
      # Playwright run so the stack boots with the script book and WITHOUT
      # replay (the clarify loop above needs replay on).
      - name: Run agents & skills e2e (scripted offline stub, no live keys)
        env:
          AI_REPLAY: "0"
          AI_OFFLINE_SCRIPT_FILE: e2e/fixtures/agents/script-book.json
        run: |
          echo "agents-e2e stack: API=${E2E_API_PORT} UI=${E2E_UI_PORT}"
          pnpm --filter @metis/e2e exec playwright test agents-skills.spec.ts --project=chromium --reporter=list

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generative-e2e-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generative-e2e-traces
          # #260 — `stack-data/` is the stack's own SQLite/LanceDB/uploads, not
          # test evidence, and LanceDB names table directories `tc:<id>`. One
          # colon in any path fails the WHOLE upload, which is how a flake's
          # video and error context were lost. Exclude it; keep everything else.
          path: |
            e2e/test-results
            !e2e/test-results/stack-data
          if-no-files-found: ignore
          retention-days: 3

  # Issue #62 — the FULL Playwright suite, on every pull request.
  #
  # This job used to carry `if: vars.E2E_ENABLED == 'true'`. That variable was
  # never set, so the job never ran on any PR and the suite rotted unseen: at
  # the time #62 was filed, ~150 of 591 specs failed on `main`. The gate was
  # added (#144) for self-hosted EMU runners that no longer exist — this
  # workflow runs on GitHub-hosted runners, which are free on a public
  # repository — so it is gone rather than flipped, and there is deliberately
  # no `continue-on-error` and no `|| true`: if the suite is red, the job is
  # red.
  #
  # The suite is deterministic and needs NO secrets: `e2e/playwright.config.ts`
  # boots the API + UI itself with the `offline-stub` AI provider, an offline
  # embedder, a per-run SQLite database, and mock auth. Specs that genuinely
  # need a live model or live infra skip themselves WITH A REASON
  # (`e2e/fixtures/ai-mode.ts`, the E2B sandbox spec), which the report shows.
  #
  # #844 — SHARDED across three runners. Every spec still runs on every PR;
  # `--shard=N/3` only splits the files. Each shard boots its own stack on its
  # own VM, exactly as the single job did. The `e2e-outcome` job below is the ONE
  # aggregate check to read, so the expected check set does not depend on the
  # matrix size.
  e2e:
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # The full suite was ~16 min on one runner; a shard is about a third of that
    # plus the stack boot. 45 still bounds a wedged run without cutting a cold
    # Next.js compile.
    timeout-minutes: 45
    strategy:
      # Let every shard finish: a failure in one must not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NPM_CONFIG_PRODUCTION: "false"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build shared packages
        # @metis/shared must be compiled before the server can boot under the
        # Playwright webServer (tsx resolves @metis/shared/dist at runtime).
        run: pnpm --filter @metis/shared run build

      - name: Install Playwright browsers
        # Fetches the browser binary only. The GitHub-hosted Ubuntu image already
        # carries chromium's system libraries (libnss3, libgbm, libasound2, …) —
        # this job passed without `--with-deps` on the first hosted run — so the
        # extra `apt` pass would only add time.
        run: pnpm --filter @metis/e2e exec playwright install chromium

      # Issue #1067 — same fixed-port hazard as `generative-e2e` above; this job
      # boots the identical stack from the same config, so it needs the same
      # per-run allocation (and would otherwise collide with `generative-e2e`,
      # which runs concurrently on the same PR).
      - name: Allocate per-run e2e ports
        run: node scripts/allocate-e2e-ports.mjs

      - name: Run Playwright e2e suite
        # `--fail-on-flaky-tests`: the config retries once on CI, which is fine
        # for DIAGNOSING a flake but must never hide one — a spec that only
        # passes on the retry fails this job, so flakes get fixed rather than
        # absorbed.
        #
        # No `--reporter` flag (#260): it REPLACED the config's CI reporters
        # (list + html), so `playwright-report/` was never written and the upload
        # below was a no-op. The HTML report is the one artifact that times every
        # step of the FAILED first attempt — the retry's trace cannot say where
        # a 120 s timeout went. The log output is unchanged (list stays on).
        run: |
          echo "e2e stack (shard ${{ matrix.shard }}/3): API=${E2E_API_PORT} UI=${E2E_UI_PORT}"
          pnpm --filter @metis/e2e test --fail-on-flaky-tests --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        # Only upload on failure to avoid accumulating report artifacts on
        # every green run. These were filling remote GitHub Actions storage.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          # #260 — `stack-data/` is the stack's own SQLite/LanceDB/uploads, not
          # test evidence, and LanceDB names table directories `tc:<id>`. One
          # colon in any path fails the WHOLE upload, which is how a flake's
          # video and error context were lost. Exclude it; keep everything else.
          path: |
            e2e/test-results
            !e2e/test-results/stack-data
          if-no-files-found: ignore
          retention-days: 3

  # #844 — the ONE e2e check to read. The matrix above reports one check per
  # shard; this job reduces them to a single always-present pass/fail, so the
  # expected check set stays fixed whatever the shard count.
  #
  # Unlike `api-outcome`, ANYTHING but `success` fails here, `cancelled` and
  # `skipped` included: a job that hits `timeout-minutes` can conclude
  # `cancelled`, and a suite that did not run is not a suite that passed. A
  # genuine supersede cancels this run's checks too, so read the newer run.
  e2e-outcome:
    name: e2e-outcome
    runs-on: ubuntu-latest
    needs: [e2e]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Classify e2e shard outcome
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "e2e shards: $E2E_RESULT"
          echo "- \`e2e\` (all shards): **$E2E_RESULT**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$E2E_RESULT" != "success" ]; then
            echo "::error title=e2e not green::The sharded e2e suite concluded '$E2E_RESULT'. Read the failing 'e2e (N/3)' job's log; a cancelled shard may have timed out."
            exit 1
          fi

  # #848 — a red nightly must not go unnoticed. GitHub tells only the user who
  # last edited the `cron` line, and since #844 the nightly (with `main` pushes)
  # is the only run of the path-gated `postgres-adapter` and `api` image work.
  # This job opens a `ci-nightly` issue (or comments on the open one) with the run
  # URL and the failing jobs, and comments on and closes it when a later nightly
  # passes. Logic and tests: scripts/lib/ci-nightly-report-core.mjs.
  #
  # Schedule-only: on a PR (and on push / workflow_dispatch) this job reads
  # `skipping`, which is expected. `needs` lists EVERY other job
  # (ci-nightly-report-repo.test.mjs enforces it), so a job added later cannot
  # fail the nightly without being reported.
  nightly-report:
    name: nightly-report
    runs-on: ubuntu-latest
    needs:
      - changes
      - api
      - api-outcome
      - ui
      - server
      - changelog
      - sql-lineage
      - postgres-adapter
      - postgres-migrate-deploy
      - generative-e2e
      - e2e
      - e2e-outcome
    if: ${{ always() && github.event_name == 'schedule' }}
    timeout-minutes: 5
    # The ONLY job that writes anything; the workflow default stays `contents: read`.
    # Job-level permissions replace the workflow's, so `contents: read` is restated
    # for the checkout. `actions: read` lists the run's jobs (per-shard names).
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Open, update or close the ci-nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-nightly-report.mjs
