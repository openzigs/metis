# CLA enforcement (#1301).
#
# Comments on every pull request from an author who has not signed the METIS
# Individual CLA, and sets a commit status that stays red until they do. Signing is a
# reply on the PR; the bot records it in `signatures/version1/cla.json` on the
# `cla-signatures` branch and recognises the author on every later PR.
#
# ## Why `pull_request_target`, and why that is safe HERE
#
# `pull_request_target` runs the workflow file from the BASE branch with a write-scoped
# token and access to repository secrets, while the event describes a pull request that
# may come from a fork. That combination is dangerous for one specific reason: if the
# job checks out or executes the PR's code, a fork author gets arbitrary execution with
# a write token. It is the canonical GitHub Actions privilege-escalation shape.
#
# This job never touches the PR's code. There is no `actions/checkout`, no `pnpm
# install`, no build step — the only step reads the event payload and writes a comment,
# a status and a signature file. The elevated token is required precisely because those
# three writes are the job, and a fork PR cannot get one any other way.
#
# **Do not add a checkout step to this workflow.** If this file ever needs to inspect
# the contributor's diff, that belongs in a separate `pull_request`-triggered job with
# a read-only token, not here.
#
# ## Why the action is pinned to a commit
#
# Every action in this repository is pinned to a full commit SHA rather than a tag
# (#586 supply-chain hardening). A tag is mutable: whoever controls the action's
# repository can repoint `v2.6.1` at new code, which would then run here with the write
# token described above. The SHA below is `v2.6.1`.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Least privilege for what this job actually does: comment on the PR, set its status,
# and commit the signature file. No `packages`, no `id-token`, no `deployments`.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    # Comments are noisy: only the two that mean something to this bot get a run.
    if: >-
      (github.event_name == 'issue_comment' &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signatures live on a dedicated orphan-style branch rather than on `main`,
          # so recording a signature never touches the default branch's history and
          # never races a contributor's own PR.
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/openzigs/metis/blob/main/CLA.md
          # DO NOT add `remote-organization-name` or `remote-repository-name` here.
          # They read like "which repository is this" and mean the opposite: "store
          # the signature file in a DIFFERENT repository". Setting EITHER one — even
          # to this repository's own org and name — switches every signature read and
          # write onto a `PERSONAL_ACCESS_TOKEN` client that this workflow does not
          # supply, and the action then calls `core.setFailed` on the first
          # contributor who tries to sign. Same-repository storage is the default, so
          # the correct configuration is to set neither.
          # `scripts/verify-cla-workflow.mjs` fails `pnpm lint` if either returns.
          custom-notsigned-prcomment: >-
            Thanks for the pull request. METIS asks contributors to sign a Contributor
            Licence Agreement before their work can be merged.


            **Why**: so that Zylos Labs LLC can change METIS's licence in future without
            having to find and ask every past contributor. That is the whole reason —
            there is no paid edition this feeds. You keep the copyright in your work and
            may use it anywhere else. The full reasoning is in
            [CONTRIBUTING.md](https://github.com/openzigs/metis/blob/main/CONTRIBUTING.md#why-there-is-a-cla),
            and the terms are in [CLA.md](https://github.com/openzigs/metis/blob/main/CLA.md).


            If you are contributing as part of your employment, your employer probably
            also needs to sign the
            [Corporate CLA](https://github.com/openzigs/metis/blob/main/CLA-CORPORATE.md).


            If you would rather not sign, say so on this pull request and it will be
            closed without argument. Declining is a legitimate position and you will not
            be chased about it.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: >-
            All contributors on this pull request have signed the CLA. Thank you.
          # Bots open dependency PRs that no human can sign for. `mgcronin` is the
          # principal of Zylos Labs LLC, which is the party the CLA grants rights TO —
          # a grant from the receiving party to itself conveys nothing, so there is
          # nothing for them to sign. Without this entry the check is permanently red
          # on the maintainer's own pull requests, which is how a team learns to stop
          # reading the check column.
          allowlist: mgcronin,dependabot[bot],renovate[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
