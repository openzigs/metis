name: Build core images — multi-arch

# Sub-issue #373 (Epic #360) — multi-arch (linux/amd64,linux/arm64) buildx
# of the four METIS images the Helm chart pulls (#150 removed copilot-svc, with
# GitHub Copilot support):
#   - server         → Dockerfile.server
#   - ui             → Dockerfile.ui
#   - embeddings-svc → Dockerfile.embeddings
#   - sql-lineage    → Dockerfile.sql-lineage (#1382: the chart enables it by
#     default, and it was never published, so a stock install sat in
#     ImagePullBackOff. scripts/lib/image-build-wiring.test.mjs now fails when
#     the chart references an image this matrix does not publish.)
#
# On a release tag (`v*`) all four images are built for both architectures
# and pushed to GHCR with both `<tag>` and `latest` references. On a PR
# touching the Dockerfiles, the chart, or the source tree, we build for
# the runner's NATIVE arch only (no push) to validate compilation.
#
# That native arch is now linux/amd64. It used to be linux/arm64, because the
# runner was arm64 and an emulated amd64 build segfaulted
# `next build` (Dockerfile.ui) under QEMU with signal 11, hanging the job to
# its 60-minute timeout. GitHub-hosted standard runners are amd64, so the
# emulation that caused that is gone and the native build is the amd64 one.
# The tag-publish path below still produces both architectures.

on:
  push:
    tags:
      - "v*"
  # Heavy multi-arch image builds run on release tags only — NOT on PRs.
  # PR-time Dockerfile validation for the core images is covered by ci.yml's
  # `api` job (native amd64 build + image-size gate), so PRs stay fast and the
  # 4-runner box isn't flooded with concurrent buildx jobs.
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  # The publishing namespace follows whoever owns the repository, so a fork
  # publishes to its own org and nothing here has to be edited when ownership
  # moves (#1373). Today that resolves to `ghcr.io/openzigs`.
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # #1379 — one OS patch date for the whole run, so every scan leg and every
  # publish leg pass the same OS_PATCH_DATE (the cache-busting ARG in front of each
  # runtime stage's `apt-get upgrade` / `apk upgrade`; see ci.yml's `OS patch date`).
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      date: ${{ steps.patch.outputs.date }}
    steps:
      - name: OS patch date
        id: patch
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  # #1379 — scan BEFORE anything is published, on BOTH architectures, building
  # exactly what the publish builds (same Dockerfile, same OS_PATCH_DATE, the
  # default BAKE_MODELS=1). Each leg runs natively (amd64 on ubuntu-latest, arm64
  # on the free ubuntu-24.04-arm runner), so no QEMU. The gate is
  # scripts/lib/image-scan-gate.mjs via scripts/ci/trivy-scan.sh: a fixable
  # HIGH/CRITICAL, an unrecorded unfixed CRITICAL, an expired or retired waiver,
  # or a report that scanned no OS packages fails its leg.
  #
  # `build` needs EVERY leg, so one image failing its gate publishes NOTHING: a
  # release with three of its four images is the #1382 failure in another shape.
  # `fail-fast: false` so every leg still reports.
  #
  # Residual gap, stated in K8S_PROD_CHECKLIST §9: the publish step rebuilds
  # (multi-arch, under QEMU for arm64) rather than pushing these exact bytes. With
  # digest-pinned bases and one OS_PATCH_DATE, the package set is the same unless
  # the distro mirror published an update between the two builds.
  #
  # Also runs on workflow_dispatch (scan only, nothing is pushed), so the release
  # scan can be exercised without cutting a tag.
  scan:
    name: Scan ${{ matrix.image.name }} (${{ matrix.arch.platform }})
    needs: [prep]
    if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: server, dockerfile: Dockerfile.server }
          - { name: ui, dockerfile: Dockerfile.ui }
          - { name: embeddings-svc, dockerfile: Dockerfile.embeddings }
          - { name: sql-lineage, dockerfile: Dockerfile.sql-lineage }
        arch:
          - { platform: linux/amd64, slug: amd64, runner: ubuntu-latest, trivy: 64bit }
          - { platform: linux/arm64, slug: arm64, runner: ubuntu-24.04-arm, trivy: ARM64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          docker image prune --all --force > /dev/null
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build for scan (as published, native arch, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          build-args: |
            OS_PATCH_DATE=${{ needs.prep.outputs.date }}
          platforms: ${{ matrix.arch.platform }}
          push: false
          load: true
          tags: metis-${{ matrix.image.name }}:scan
          provenance: false
          sbom: false
          # Read-only, like the publish step: a cache written from a tag ref is
          # unreadable by every later run.
          cache-from: type=gha,scope=metis-${{ matrix.image.name }}

      - name: Restore Trivy DB cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ matrix.arch.slug }}-${{ needs.prep.outputs.date }}
          restore-keys: trivy-db-${{ matrix.arch.slug }}-

      - name: Install Trivy (pinned + checksum-verified)
        env:
          # Keep in step with ci.yml's `Install Trivy` (scripts/ci/install-trivy.sh).
          TRIVY_VERSION: "0.71.1"
          TRIVY_ARCH: ${{ matrix.arch.trivy }}
          TRIVY_SHA256: ${{ matrix.arch.trivy == 'ARM64' && 'a7daaee66817d67a4963e8f9ddf15f5238ee021b55d3cd8695b1b7801afd34a7' || '3cbae37cd440cd8676e5ce9207fe460b5641c7579a17e9d00f8894928c41a88d' }}
        run: bash scripts/ci/install-trivy.sh

      - name: Scan image (Trivy, HIGH/CRITICAL) and gate
        env:
          REPORT_DIR: trivy-reports
        run: bash scripts/ci/trivy-scan.sh "${{ matrix.image.name }}=metis-${{ matrix.image.name }}:scan"

      # Non-blocking: the GATE above decides whether the release ships; a
      # code-scanning upload that fails (an API hiccup, a tag-ref quirk) must not
      # fail the leg on its own. Waived results are filtered out first.
      - name: Upload image scan SARIF
        if: ${{ always() && github.event_name == 'push' && hashFiles(format('trivy-reports/{0}.filtered.sarif', matrix.image.name)) != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-reports/${{ matrix.image.name }}.filtered.sarif
          category: trivy-image-${{ matrix.image.name }}-${{ matrix.arch.slug }}-release

  build:
    name: Build ${{ matrix.image.name }}
    # #1379 — every scan leg must pass before ANY image is published.
    needs: [prep, scan]
    runs-on: ubuntu-latest
    # Dependency-only bumps (dependabot PRs) don't need multi-arch Docker
    # validation — the CI workflow already runs `docker build` for those.
    # Skipping here prevents a flood of BuildKit containers on the
    # runner when dependabot opens several PRs simultaneously.
    if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: server, dockerfile: Dockerfile.server }
          - { name: ui, dockerfile: Dockerfile.ui }
          - { name: embeddings-svc, dockerfile: Dockerfile.embeddings }
          - { name: sql-lineage, dockerfile: Dockerfile.sql-lineage }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove orphaned BuildKit builders
        # Builders from cancelled/failed prior runs are not always cleaned up
        # by setup-buildx-action's post-step. Prune ONLY this image's own stale
        # builders from previous runs — never a blanket `builder-*` removal.
        #
        # Why: the matrix jobs (server/ui/embeddings-svc) run on
        # runner instances that used to SHARE ONE Docker daemon on
        # the same Mac. A blanket `docker buildx rm` of every `builder-*` would
        # delete the builder a *sibling* job is actively using, killing its
        # build with `graceful_stop`/`goaway` EOF. The fast images finished
        # before being nuked; the slow UI `next build` consistently lost its
        # builder mid-build. Scoping cleanup to this job's own image-named
        # builder eliminates the cross-job interference.
        run: |
          docker buildx ls 2>/dev/null \
            | awk 'NR>1 && /^metis-${{ matrix.image.name }}-/ {print $1}' \
            | xargs -r docker buildx rm --force 2>/dev/null || true

      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="pr-${{ github.event.pull_request.number || 'manual' }}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # #3 — a hosted runner leaves ~14 GB free, and the multi-arch publish of
      # the larger images does not fit. Drop preinstalled toolchains no step
      # here uses, and the runner's cached Docker images (~25 GB back).
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          docker image prune --all --force > /dev/null
          df -h /

      - name: Set up QEMU (multi-arch emulation)
        # PR validation builds only target the native runner arch —
        # no QEMU emulation needed. Skip this step on PRs to avoid pulling
        # tonistiigi/binfmt:latest from Docker Hub on every PR, which causes
        # 30+ min hangs if the image has been evicted from the local Docker
        # daemon (e.g. after nightly maintenance cleanup). QEMU is only needed
        # for the tag-triggered multi-arch (amd64 + arm64) release builds.
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64,linux/arm64
          # Disable the action's built-in binfmt image cache. The old shared
          # runner persists Docker images between runs, so the binfmt image
          # stays locally without being written to remote GitHub Actions
          # storage (which was filling up with 29 MB binfmt entries per run).
          cache-image: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          # Unique, image-scoped, run-scoped builder name. Combined with the
          # scoped cleanup step above, this guarantees the 4 matrix jobs (which
          # daemon) never
          # delete each other's active builders. The `metis-<image>-` prefix is
          # what the cleanup step matches on.
          name: metis-${{ matrix.image.name }}-${{ github.run_id }}

      # GHCR login is only required for pushes (tag triggers). On PRs we
      # validate compilation without pushing.
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR — single-arch validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          # Skip the HuggingFace model bake on PR validation builds. Baking
          # downloads models at build time (Dockerfile.embeddings, BAKE_MODELS=1)
          # which is flaky and unnecessary for
          # compilation validation — the embeddings sidecar downloads models at
          # runtime when not baked. The tag-push build below keeps the default
          # (BAKE_MODELS=1) so released images stay self-contained. Harmless for
          # the other images (only Dockerfile.embeddings reads BAKE_MODELS).
          build-args: |
            BAKE_MODELS=0
            OS_PATCH_DATE=${{ needs.prep.outputs.date }}
          # Native arch only — linux/amd64 on a GitHub-hosted runner. Building
          # the non-native arch here would force QEMU emulation, which is what
          # segfaulted `next build` (signal 11) on the old arm64 runner. Native
          # validates the same Dockerfile compilation without emulation.
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/metis-${{ matrix.image.name }}:${{ steps.meta.outputs.version }}
          # Disable provenance and SBOM attestations on PR validation builds.
          # docker/build-push-action@v7 generates provenance by default and
          # stores it as a '*.dockerbuild' GitHub Actions artifact (~60 KB each,
          # 4 images x many PRs = 80+ artifacts filling the storage quota).
          # PR builds don't push to GHCR so provenance is meaningless here.
          provenance: false
          sbom: false
          # #3 — `type=gha` survives the runner; the old local-path cache in
          # /tmp/buildkit-cache lived on the self-hosted box and is an empty
          # directory on every hosted VM. Same scope as ci.yml's `api` build of
          # this image, so the cache `main` writes warms this build's amd64
          # layers. (The reverse holds only when this runs on `main`: GitHub
          # caches are scoped to the ref that wrote them.)
          cache-from: type=gha,scope=metis-${{ matrix.image.name }}
          cache-to: type=gha,scope=metis-${{ matrix.image.name }},mode=max

      - name: Build & push (tag — multi-arch publish)
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          build-args: |
            OS_PATCH_DATE=${{ needs.prep.outputs.date }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/metis-${{ matrix.image.name }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/metis-${{ matrix.image.name }}:latest
          # Provenance is kept for release pushes (supply-chain hygiene) but
          # SBOM generation is disabled — each SBOM is uploaded as a separate
          # '*.dockerbuild' artifact adding ~60 KB per image per push.
          provenance: true
          sbom: false
          # Read-only on purpose. A cache written from a tag ref can be
          # restored only by that same tag, so no later run (not `main`, not
          # the next tag) could read it, while it still counts toward the
          # repository's 10 GB cache limit and evicts `main`'s entries. Reading
          # works: a tag run restores the cache `main` wrote.
          cache-from: type=gha,scope=metis-${{ matrix.image.name }}

      - name: Inspect manifest (tag only)
        if: github.event_name == 'push'
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/metis-${{ matrix.image.name }}:${{ steps.meta.outputs.version }}

      - name: Delete untagged GHCR image versions (tag only)
        # After a release push the old untagged manifest layers pile up in
        # GHCR and count against GitHub storage. This step deletes any version
        # that has no tags attached, keeping only the tagged releases.
        if: github.event_name == 'push'
        env:
          PACKAGE: metis-${{ matrix.image.name }}
          # Same namespace as REGISTRY, via the workflow context rather than a
          # hardcoded org (#1373). Read into the shell through `env:` so the
          # expansion never becomes part of the script text.
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api "orgs/${OWNER}/packages/container/${PACKAGE}/versions?per_page=50" \
            --jq '.[] | select(.metadata.container.tags | length == 0) | .id' 2>/dev/null \
          | while read -r id; do
              gh api -X DELETE "orgs/${OWNER}/packages/container/${PACKAGE}/versions/${id}" 2>/dev/null && echo "Deleted untagged version $id" || true
            done

      - name: Free disk — drop loaded image and trim daemon cache
        # Runs after every job (success, failure, or cancellation). The layer
        # cache that carries between runs is the GitHub Actions cache
        # (`type=gha`, #3), which this does not touch.
        if: always()
        run: |
          docker rmi "${{ env.REGISTRY }}/metis-${{ matrix.image.name }}:${{ steps.meta.outputs.version }}" 2>/dev/null || true
          docker image prune -f 2>/dev/null || true
          docker buildx prune -f --keep-storage=4g 2>/dev/null || true
