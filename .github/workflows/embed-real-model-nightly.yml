# Issue #201 — load the REAL gte-modernbert in the embed worker, from the built
# server `dist`, under plain node.
#
# Every PR-time embed-worker suite runs a deterministic stub model and
# `server/tests/setup.ts` pins the `inline` runtime, so the real model never runs
# in the worker in CI. This job does, nightly and on demand, to catch a CJS/ESM
# loader defect in the worker's `import()` of transformers.js, and to check the
# chunker's #201 token bound against the model's own tokenizer.
name: Embed Real Model Nightly

on:
  schedule:
    # 04:00 UTC daily — staggered after the eval nightlies (02:00, 03:00 UTC).
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: embed-real-model-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  real-model-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/transformers
      EMBED_REAL_MODEL_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --prod=false
      - name: Build shared package
        run: pnpm --filter @metis/shared run build
      - name: Build server
        run: pnpm --filter @metis/server run build
      # The weights (~150 MB) come from the Hugging Face hub only on a cache miss, so
      # a hub outage or rate limit does not turn a warm run red. The key names the
      # model; bump it when the model or its revision changes.
      - name: Cache model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/transformers
          key: transformers-gte-modernbert-base-v1-${{ runner.os }}
      - name: Real model in the embed worker, from dist
        working-directory: server
        run: pnpm exec vitest run tests/embed-worker-real-model.test.ts
